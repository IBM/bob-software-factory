<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IBM Bob Factory Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e17;
      --card-bg: #111726;
      --card-elevated: #182238;
      --border: #212e4a;
      --text: #f4f6fb;
      --muted: #8792a8;
      --blue: #0f62fe;
      --cyan: #33b1ff;
      --green: #42be65;
      --red: #fa4d56;
      --yellow: #f1c21b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'IBM Plex Sans', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      line-height: 1.5;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      background: rgba(15, 98, 254, 0.2);
      border: 1px solid rgba(15, 98, 254, 0.4);
      color: var(--cyan);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .board-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }
    .column {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      min-height: 480px;
      display: flex;
      flex-direction: column;
    }
    .col-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .count {
      background: var(--card-elevated);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .col-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-grow: 1;
    }
    .job-card {
      background: var(--card-elevated);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .job-card:hover {
      border-color: var(--cyan);
      transform: translateY(-2px);
    }
    .job-card.needs-human {
      border-color: var(--red);
      background: rgba(250, 77, 86, 0.08);
    }
    .job-id {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
      color: var(--cyan);
      font-weight: 600;
      margin-bottom: 4px;
    }
    .job-title {
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .reviews-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin-top: 8px;
    }
    .rev-chip {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.65rem;
      padding: 2px 4px;
      border-radius: 3px;
      text-align: center;
      font-weight: 600;
      text-transform: uppercase;
    }
    .rev-chip.pass { background: rgba(66, 190, 101, 0.2); color: var(--green); border: 1px solid rgba(66, 190, 101, 0.4); }
    .rev-chip.changes { background: rgba(250, 77, 86, 0.2); color: var(--red); border: 1px solid rgba(250, 77, 86, 0.4); }
    .rev-chip.pending { background: rgba(135, 146, 168, 0.15); color: var(--muted); border: 1px solid rgba(135, 146, 168, 0.25); }

    /* Modal for Markdown preview */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }
    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 100%;
      max-width: 640px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
      color: #cbd5e1;
    }
    .close-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="../assets/bob.png" alt="IBM Bob" width="34" height="34" style="object-fit: contain; filter: drop-shadow(0 0 6px rgba(15, 98, 254, 0.4));">
      <h2>IBM Bob Software Factory</h2>
      <span class="badge">LIVE BOARD</span>
    </div>
    <div id="status-time" style="font-size: 0.8rem; color: var(--muted); font-family: 'IBM Plex Mono', monospace;">Polling board.json...</div>
  </header>

  <main class="board-grid">
    <div class="column">
      <div class="col-header"><span>1. Specification</span><span class="count" id="count-spec">0</span></div>
      <div class="col-body" id="col-spec"></div>
    </div>
    <div class="column">
      <div class="col-header"><span>2. In Build</span><span class="count" id="count-build">0</span></div>
      <div class="col-body" id="col-build"></div>
    </div>
    <div class="column">
      <div class="col-header"><span>3. Parallel Review</span><span class="count" id="count-review">0</span></div>
      <div class="col-body" id="col-review"></div>
    </div>
    <div class="column">
      <div class="col-header"><span>4. Needs Human</span><span class="count" id="count-needs-human">0</span></div>
      <div class="col-body" id="col-needs-human"></div>
    </div>
    <div class="column">
      <div class="col-header"><span>5. Merged to Main</span><span class="count" id="count-merged">0</span></div>
      <div class="col-body" id="col-merged"></div>
    </div>
  </main>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title" style="font-size: 1rem;">Job Details</h3>
        <button class="close-btn" id="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="modal-content">Loading...</div>
    </div>
  </div>

  <script>
    async function loadBoard() {
      try {
        const res = await fetch('board.json');
        const data = await res.json();
        render(data.jobs || []);
        document.getElementById('status-time').textContent = 'Last synced: ' + new Date().toLocaleTimeString();
      } catch (err) {
        document.getElementById('status-time').textContent = 'Sync waiting (run from factory/ folder)';
      }
    }

    function render(jobs) {
      const cols = {
        spec: document.getElementById('col-spec'),
        build: document.getElementById('col-build'),
        review: document.getElementById('col-review'),
        "needs-human": document.getElementById('col-needs-human'),
        merged: document.getElementById('col-merged')
      };

      const counts = { spec: 0, build: 0, review: 0, "needs-human": 0, merged: 0 };
      Object.values(cols).forEach(c => c.innerHTML = '');

      jobs.forEach(job => {
        counts[job.stage] = (counts[job.stage] || 0) + 1;
        const col = cols[job.stage];
        if (!col) return;

        const card = document.createElement('div');
        card.className = `job-card ${job.stage === 'needs-human' ? 'needs-human' : ''}`;
        
        let chips = '';
        if (job.reviews) {
          chips = `
            <div class="reviews-row">
              <span class="rev-chip ${job.reviews.security.toLowerCase()}">SEC:${job.reviews.security}</span>
              <span class="rev-chip ${job.reviews.ux.toLowerCase()}">UX:${job.reviews.ux}</span>
              <span class="rev-chip ${job.reviews.ui.toLowerCase()}">UI:${job.reviews.ui}</span>
              <span class="rev-chip ${job.reviews.code.toLowerCase()}">CODE:${job.reviews.code}</span>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="job-id">${job.id} ${job.round ? '· Round ' + job.round : ''}</div>
          <div class="job-title">${job.title || job.id}</div>
          <div style="font-size: 0.72rem; color: var(--muted); font-family: 'IBM Plex Mono', monospace;">branch: ${job.branch}</div>
          ${chips}
        `;

        card.addEventListener('click', () => {
          document.getElementById('modal-title').textContent = `Job: ${job.id}`;
          document.getElementById('modal-content').textContent = JSON.stringify(job, null, 2);
          document.getElementById('modal-overlay').style.display = 'flex';
        });

        col.appendChild(card);
      });

      Object.keys(counts).forEach(k => {
        const countEl = document.getElementById(`count-${k}`);
        if (countEl) countEl.textContent = counts[k];
      });
    }

    document.getElementById('modal-close').addEventListener('click', () => {
      document.getElementById('modal-overlay').style.display = 'none';
    });
    document.getElementById('modal-overlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('modal-overlay')) {
        document.getElementById('modal-overlay').style.display = 'none';
      }
    });

    setInterval(loadBoard, 2000);
    loadBoard();
  </script>
</body>
</html>
